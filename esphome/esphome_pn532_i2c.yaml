# ==============================================================================
# ESPHome Configuration: NFC Media Reader (PN532 via I2C)
# ==============================================================================
# Hardware: ESP32 / ESP8266 + PN532 NFC Module
# Function: Detects tag placement (Play) & removal (Toniebox Stop) and sends MQTT.

substitutions:
  device_name: "nfc-reader-kids-room"
  reader_id: "reader_kizi"  # Must match the reader_id in the middleware
  mqtt_broker: "192.168.1.50"
  mqtt_port: "1883"
  mqtt_user: "nfc_user"
  mqtt_password: "secret_password"
  wifi_ssid: "YourWiFiSSID"
  wifi_password: "YourWiFiPassword"

esphome:
  name: ${device_name}
  friendly_name: "NFC Reader Kids Room"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Improv Wi-Fi via Serial (ermöglicht direkte WLAN-Einrichtung im Browser über ESP Web Tools)
improv_serial:

web_server:
  port: 80

captive_portal:

# WiFi Configuration
wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  ap:
    ssid: "NFC-PN532-Fallback"
    password: "setup_password"

logger:
  level: INFO

# MQTT Client Configuration
mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: ${mqtt_password}
  discovery: false

# I2C Bus for PN532
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

# Global state variables for Toniebox presence polling
globals:
  - id: current_tag_id
    type: std::string
    initial_value: '""'
  - id: tag_is_present
    type: bool
    initial_value: 'false'
  - id: consecutive_misses
    type: int
    initial_value: '0'

# PN532 NFC Component
pn532_i2c:
  id: pn532_board
  update_interval: 200ms
  on_tag:
    then:
      - lambda: |-
          id(consecutive_misses) = 0;
          // New tag placed or state change
          if (!id(tag_is_present) || id(current_tag_id) != x) {
            id(current_tag_id) = x;
            id(tag_is_present) = true;
            
            // Build JSON payload
            std::string payload = "{\"tag_id\": \"" + x + "\", \"reader_id\": \"${reader_id}\", \"status\": \"scanned\"}";
            ESP_LOGI("NFC", "Tag scanned: %s -> Publishing to rfid/scanned", x.c_str());
            id(mqtt_client).publish("rfid/scanned", payload);
          }

# Periodic loop checking if tag has been removed (Toniebox removal logic)
interval:
  - interval: 300ms
    then:
      - lambda: |-
          if (id(tag_is_present)) {
            id(consecutive_misses)++;
            // If not seen for 2 consecutive cycles (~600ms) -> tag removed
            if (id(consecutive_misses) >= 2) {
              std::string old_tag = id(current_tag_id);
              id(tag_is_present) = false;
              id(current_tag_id) = "";
              id(consecutive_misses) = 0;

              // Publish Tag Removed Event
              std::string payload = "{\"tag_id\": \"" + old_tag + "\", \"reader_id\": \"${reader_id}\", \"status\": \"removed\"}";
              ESP_LOGI("NFC", "Tag removed: %s -> Publishing Stop Event", old_tag.c_str());
              id(mqtt_client).publish("rfid/scanned", payload);
            }
          }
