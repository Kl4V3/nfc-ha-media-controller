# ==============================================================================
# ESPHome Configuration: RFID Media Reader (RC522 via SPI)
# ==============================================================================
# Hardware: ESP32 + RC522 RFID Module (SPI)
# Function: Detects tag placement & removal and sends MQTT events to middleware.

substitutions:
  device_name: "rfid-reader-living-room"
  reader_id: "reader_living_room"
  mqtt_broker: "192.168.1.50"
  mqtt_port: "1883"

esphome:
  name: ${device_name}
  friendly_name: "RFID Reader Living Room"

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: "YourWiFiSSID"
  password: "YourWiFiPassword"

logger:
  level: INFO

mqtt:
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: "nfc_user"
  password: "secret_password"

# SPI Bus
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

globals:
  - id: current_tag_id
    type: std::string
    initial_value: '""'
  - id: tag_is_present
    type: bool
    initial_value: 'false'
  - id: consecutive_misses
    type: int
    initial_value: '0'

rc522_spi:
  cs_pin: GPIO5
  reset_pin: GPIO22
  update_interval: 200ms
  on_tag:
    then:
      - lambda: |-
          id(consecutive_misses) = 0;
          if (!id(tag_is_present) || id(current_tag_id) != x) {
            id(current_tag_id) = x;
            id(tag_is_present) = true;
            
            std::string payload = "{\"tag_id\": \"" + x + "\", \"reader_id\": \"${reader_id}\", \"status\": \"scanned\"}";
            ESP_LOGI("RFID", "Tag scanned: %s", x.c_str());
            id(mqtt_client).publish("rfid/scanned", payload);
          }

interval:
  - interval: 300ms
    then:
      - lambda: |-
          if (id(tag_is_present)) {
            id(consecutive_misses)++;
            if (id(consecutive_misses) >= 2) {
              std::string old_tag = id(current_tag_id);
              id(tag_is_present) = false;
              id(current_tag_id) = "";
              id(consecutive_misses) = 0;

              std::string payload = "{\"tag_id\": \"" + old_tag + "\", \"reader_id\": \"${reader_id}\", \"status\": \"removed\"}";
              ESP_LOGI("RFID", "Tag removed: %s", old_tag.c_str());
              id(mqtt_client).publish("rfid/scanned", payload);
            }
          }
