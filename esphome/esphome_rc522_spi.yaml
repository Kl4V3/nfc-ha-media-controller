# ==============================================================================
# ESPHome Configuration: RFID Media Reader (RC522 via SPI)
# ==============================================================================
# Hardware: ESP32 + RC522 RFID Module (SPI)
# Function: Detects tag placement & removal and sends MQTT events to middleware.

substitutions:
  device_name: "rfid-reader-living-room"
  reader_id: "reader_living_room"
  mqtt_broker: "192.168.1.50"
  mqtt_port: "1883"
  mqtt_user: "nfc_user"
  mqtt_password: "secret_password"
  wifi_ssid: "YourWiFiSSID"
  wifi_password: "YourWiFiPassword"

esphome:
  name: ${device_name}
  friendly_name: "RFID Reader Living Room"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Improv Wi-Fi via Serial (ermöglicht direkte WLAN-Einrichtung im Browser über ESP Web Tools)
improv_serial:

web_server:
  port: 80

captive_portal:

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  fast_connect: true
  ap:
    ssid: "RFID-RC522-Fallback"
    password: "setup_password"

logger:
  level: INFO

mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: ${mqtt_password}

# SPI Bus
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# RC522 SPI RFID Reader
rc522_spi:
  cs_pin: GPIO5
  reset_pin: GPIO22
  update_interval: 300ms
  on_tag:
    then:
      - lambda: |-
          std::string payload = "{\"tag_id\": \"" + x + "\", \"reader_id\": \"${reader_id}\", \"status\": \"scanned\"}";
          ESP_LOGI("RFID", "Tag scanned: %s -> Sende rfid/scanned (Play)", x.c_str());
          id(mqtt_client).publish("rfid/scanned", payload);

  on_tag_removed:
    then:
      - lambda: |-
          std::string payload = "{\"tag_id\": \"" + x + "\", \"reader_id\": \"${reader_id}\", \"status\": \"removed\"}";
          ESP_LOGI("RFID", "Tag removed: %s -> Sende Toniebox-Stop", x.c_str());
          id(mqtt_client).publish("rfid/scanned", payload);
