# ==============================================================================
# NGINX Reverse Proxy Configuration for NFC Media Controller
# ==============================================================================
# Include this configuration in your existing NGINX server setup.
# Authentication is handled via HTTP Basic Authentication (.htpasswd) or IP Whitelisting.

server {
    listen 80;
    server_name nfc.local;

    # Optional: Enable SSL
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/nfc.local/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nfc.local/privkey.pem;

    # Basic Authentication
    auth_basic "NFC Controller Administration";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Alternative / Additional: IP Whitelisting (local subnet only)
    # allow 192.168.1.0/24;
    # allow 127.0.0.1;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket support (for real-time live feed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
