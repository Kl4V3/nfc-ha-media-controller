; PlatformIO Project Configuration File for ESP32 + PN5180 NFC Reader
; NFC Media Controller - Toniebox & ISO-15693 / ISO-14443 Reader

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/ATrappmann/PN5180-Library.git
